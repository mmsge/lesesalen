# CI for lesesalen.
#
# Three things need proving on every change, and only one of them is the test
# suite:
#
#  1. The server behaves (pytest), including the security guards.
#  2. `client/dist` is genuinely the build of `client/src`. The client is built
#     here and committed, never on the box (ADR 0001) — which only works if a
#     stale bundle is caught, so the job rebuilds and diffs.
#  3. The image builds and boots. The box runs `docker compose up -d --build`,
#     so a Dockerfile that only works on a developer's laptop is a broken deploy.
name: CI

# push only on the default branch — PRs cover feature branches, so a branch
# push doesn't double-run the job.
on:
  push:
    branches: [hovud]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the page dates are derived from git log; a shallow
          # checkout collapses created/modified onto the newest commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Generate page dates
        run: |
          ./scripts/generate-page-dates.sh
          cat page-dates.json
          python -c "import json; d=json.load(open('page-dates.json')); assert d['created'] and d['modified']"

      - name: Generate build info
        run: |
          ./scripts/generate-build-info.sh
          cat build-info.json
          python -c "import json; d=json.load(open('build-info.json')); assert len(d['commit'])==40"

      - name: Tests
        run: python -m pytest -q

      - name: Boot + smoke test (healthz, discoverability, page-dates metadata, 304)
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8080 --no-access-log &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done

          curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok
          # The ops contract (hetzner-server ADR 0022): /version must be JSON, not
          # the SPA shell — an HTML 200 here reads as "endpoint missing" to the
          # box's probe, which is a silent failure rather than a loud one.
          curl -fsS http://127.0.0.1:8080/version | grep -q '"source": *"build-info"'
          curl -fsSI http://127.0.0.1:8080/version | grep -qi 'content-type: application/json'
          curl -fsSI http://127.0.0.1:8080/version | grep -qi 'cache-control: no-store'
          # degraded is a 200 on purpose, so -f is the right check: only a real
          # failure (503) should fail CI.
          curl -fsS http://127.0.0.1:8080/health | grep -q '"checks"'
          # Redaction: /health is public. Nothing about the box's interior in it.
          ! curl -fsS http://127.0.0.1:8080/health | grep -qE '/data|/app|127\.0\.0\.1|172\.18\.0\.1|8080|LESESALEN_'
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q 'Sitemap: https://lesesalen.msge.no/sitemap.xml'
          curl -fsS http://127.0.0.1:8080/sitemap.xml | grep -q '<loc>https://lesesalen.msge.no/</loc>'
          ! curl -fsS http://127.0.0.1:8080/sitemap.xml | grep -q '__LASTMOD__'

          page=$(curl -fsS http://127.0.0.1:8080/)
          echo "$page" | grep -q 'article:published_time'
          echo "$page" | grep -q 'article:modified_time'
          echo "$page" | grep -q '"dateModified"'
          echo "$page" | grep -q '<html lang="nn"'

          # The CSP directives that actually stop an XSS from stealing the token.
          headers=$(curl -fsSI http://127.0.0.1:8080/)
          echo "$headers" | grep -qi "script-src 'self'"
          echo "$headers" | grep -qi "object-src 'none'"
          ! echo "$headers" | grep -qi "unsafe-inline"
          ! echo "$headers" | grep -qi "unsafe-eval"
          # ADR 0006: this one blanks the whole app in Chromium.
          ! echo "$headers" | grep -qi "require-trusted-types-for"

          lm=$(echo "$headers" | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p')
          test -n "$lm"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-Modified-Since: $lm" http://127.0.0.1:8080/)
          test "$code" = "304"

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Audit dependencies
        working-directory: client
        run: npm audit --audit-level=high

      - name: Rebuild and check the committed bundle is current
        working-directory: client
        run: |
          # client/dist is committed so the box never runs Node (ADR 0001). That
          # is only safe if a stale bundle fails here: rebuild and compare.
          mv dist dist-committed
          npm run build
          if ! diff -r --brief dist-committed dist; then
            echo "::error::client/dist is stale. Run 'make client' and commit the result."
            exit 1
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate page dates
        run: ./scripts/generate-page-dates.sh

      # BEFORE the build, exactly as `make deploy` does it — the SHA has to be
      # baked into the image.
      - name: Generate build info
        run: ./scripts/generate-build-info.sh

      - name: Build the image the box will build
        run: docker build -t lesesalen:ci .

      - name: Boot it and check health the way Compose does
        run: |
          docker run -d --name lesesalen-ci -p 8080:8080 lesesalen:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok
          # robots.txt and sitemap.xml must be baked in — a selective COPY that
          # omits them ships 404s, which has bitten the box before.
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q 'Sitemap:'
          curl -fsS http://127.0.0.1:8080/sitemap.xml | grep -q '<loc>'
          # The client bundle has to be in the image too.
          curl -fsS http://127.0.0.1:8080/ | grep -q '/assets/'
          # build-info.json has to be in the image as well, and this is the only
          # place that can prove it: a .dockerignore or a dropped COPY makes the
          # optional-copy glob a silent no-op, and /version then reports
          # source "unknown" forever with nothing logged anywhere.
          curl -fsS http://127.0.0.1:8080/version | grep -q '"source": *"build-info"'
          test "$(curl -fsS http://127.0.0.1:8080/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')" = "$(git rev-parse HEAD)"
          curl -fsS http://127.0.0.1:8080/health | grep -q '"checks"'
          docker logs lesesalen-ci
          docker rm -f lesesalen-ci
